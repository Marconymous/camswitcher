[workspace]
resolver = "3"
members = ["crates/shared", "crates/vcam-source", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
windows = "0.62"
windows-core = "0.62"
log = "0.4"
shared = { path = "crates/shared" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
